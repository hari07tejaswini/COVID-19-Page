<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
</head>

<body>
    <div class="page-layout">
        <div class="d-flex">
            <div class="d-flex flex-column">
                <h1>All you need to know <br> about COVID-19</h1>
                <div class="button">
                    <button class="btn btn-primary">Know more</button>
                </div>
            </div>
            <div class="d-flex flex-row">
                <img src=" https://d2clawv67efefq.cloudfront.net/ccbp-static-website/medicalcare-img.png" />
            </div>
        </div>
        <div class="covid-card">
            <div>
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/coronavirus-img.png" class="image" />
            </div>
            <div class="d-flex flex-column">
                <h1 class="card-heading">COVID-19 Test</h1>
                <p class="card-paragraph">If you think you have been exposed to novel<br>coronavirus (COVID-19)...more</p>
            </div>
        </div>
        <h1 class="heading">Symptoms</h1>
        <div class="d-flex flex-row">
            <div class="symptom1">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/cough-img.png" height="120px" width="100px" />
                <p class="symptom-text">Dry Cough</p>
            </div>
            <div class="symptom2">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/fever-img.png" height="120px" width="100px" />
                <p class="symptom-text">High Fever</p>
            </div>
            <div class="symptom3">
                <img src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/headache-img.png" height="120px" width="100px" />
                <p class="symptom-text">Headache</p>
            </div>
        </div>
        <h1 class="heading">Videos</h1>
        <div class="d-flex">
            <div class="bottom-card">
                <div>
                    <img src=" https://d2clawv67efefq.cloudfront.net/ccbp-static-website/doctor-img.png" class="bottom-card-image" />
                </div>
                <div class="d-flex flex-column">
                    <h1 class="bottom-card-heading">To prevent the spread of ... </h1>
                    <p class="bottom-card-paragraph">If you think you have been exposed to novel <br> corona virus (COVID-19)</p>
                    <div class="button">
                        <button class="btn btn-primary">Watch Video</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
